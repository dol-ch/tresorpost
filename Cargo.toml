[package]
name = "tresorpost"
version = "0.1.3"
edition = "2024"
description = "Tresorpost — end-to-end encrypted, quantum-resistant, burn-after-reading transfer service"

[[bin]]
name = "tresorpost"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace", "limit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1.26.1", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dotenvy = "0.15.7"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"

[profile.release]
opt-level = 2

# Cargo strips proc-macro dylibs in release; macOS 26/27 dyld
# then rejects misaligned LINKEDIT (sqlx_macros dlopen fails).
[profile.release.build-override]
strip = false
