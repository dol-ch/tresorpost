[package]
name = "tresorpost"
version = "0.1.14"
edition = "2024"
description = "Tresorpost — end-to-end encrypted, quantum-resistant, burn-after-reading transfer service"

[[bin]]
name = "tresorpost"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace", "limit", "set-header"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
uuid = { version = "1.26.1", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dotenvy = "0.15.7"
rand = "0.10"
sha2 = "0.11"
subtle = "2"
base64 = "0.23"
# AWS SDK's default `rustls` feature is the deprecated rustls 0.21 +
# rustls-webpki 0.101 stack (Dependabot #3 / GHSA-82j2-j2ch-gfr8).
# `default-https-client` is rustls 0.23 + aws-lc (webpki 0.103.15).
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "credentials-process",
    "sso",
    "default-https-client",
] }
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "http-1x",
    "default-https-client",
    "sigv4a",
] }
aws-credential-types = "1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[profile.release]
opt-level = 2

# Cargo strips proc-macro dylibs in release; macOS 26/27 dyld
# then rejects misaligned LINKEDIT (sqlx_macros dlopen fails).
[profile.release.build-override]
strip = false
