version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # 6.x pulls @rolldown/plugin-babel → @babel/core 8 rc peer conflict.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # TS 7 is the Go native compiler, not a security patch. Vite/Oxc
      # typechecks/transforms the app; we are not switching tsc yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on Node LTS (24). Current (26+) is not a security patch.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
