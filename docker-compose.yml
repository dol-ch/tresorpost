services:
  tresorpost:
    image: ghcr.io/dol-ch/tresorpost:latest
    # To build the image locally instead of pulling from GHCR, comment out
    # `image:` above and uncomment the next line:
    # build: .
    ports:
      - "7777:3000" # host 7777 -> app (frontend + API served together)
    environment:
      MAX_FILE_MB: "5"
      # ADMIN_TOKEN: "change-me"   # set to enable the admin dashboard at /#/admin
      DATABASE_PATH: /data/tresorpost.db
      RUST_LOG: "info"
      # Optional S3 large-file backend:
      # S3_ENDPOINT: "http://minio:9000"
      # S3_REGION: "us-east-1"
      # S3_BUCKET: "tresorpost"
      # S3_ACCESS_KEY_ID: "minioadmin"
      # S3_SECRET_ACCESS_KEY: "minioadmin"
      # S3_FORCE_PATH_STYLE: "true"
      # MAX_S3_FILE_MB: "5120"
    volumes:
      - tresorpost-data:/data
    restart: unless-stopped

volumes:
  tresorpost-data:
