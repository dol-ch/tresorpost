<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Tresorpost">
  <!-- Transparent canvas: a filled rounded tile plus the browser’s own
       squircle mask left black corners in the tab. Just the padlock. -->
  <style>
    .lock { fill: none; stroke: #18181b; stroke-width: 2.25; stroke-linecap: round; }
    .pin { fill: #18181b; }
    @media (prefers-color-scheme: dark) {
      .lock { stroke: #fafafa; }
      .pin { fill: #fafafa; }
    }
  </style>
  <g transform="translate(5 4.5)">
    <path class="lock" d="M6.5 10V7.2a4.5 4.5 0 0 1 9 0V10"/>
    <rect class="lock" x="4" y="10" width="14" height="10" rx="2.4"/>
    <circle class="pin" cx="11" cy="14.6" r="1.45"/>
    <path class="lock" d="M11 15.9v1.5"/>
  </g>
</svg>
